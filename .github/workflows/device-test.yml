name: Test na emulatorze Androida

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (platforma 36)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" --install "platforms;android-36" > /dev/null

      - name: Zależności
        run: |
          npm ci
          npm i --no-save playwright-core@1.63.0

      - name: Budowa APK (debug)
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Włączenie KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator i test gry
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tools/device-run.sh

      - name: Zrzuty ekranu z emulatora
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zrzuty-z-telefonu
          path: device-out/
          retention-days: 14
