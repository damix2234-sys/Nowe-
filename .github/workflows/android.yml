name: Android APK

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (platforma 36)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" > /dev/null

      - name: Instalacja zależności
        run: npm ci

      - name: Test silnika gry (symulacja 2 lat)
        run: node tools/sim-test.mjs POL 2

      - name: Test meczu na żywo (bez teleportów, stałe fragmenty tylko po wyjściu piłki)
        run: node tools/view-test.mjs 4

      - name: Synchronizacja Capacitor
        run: npx cap sync android

      - name: Budowanie APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Zmiana nazwy pliku
        run: cp android/app/build/outputs/apk/debug/app-debug.apk selekcjoner-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: selekcjoner-apk
          path: selekcjoner-debug.apk
          retention-days: 30
